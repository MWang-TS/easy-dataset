# 将最新 Release 产物同步到 Cloudflare R2（tsagent.cc 统一下载域）
#
# 目录约定（bucket: tsagent-downloads，域名: dl.tsagent.cc）：
#   easy-dataset/<version>/<原始文件名>   —— 本次 Release 产物，--delete 只作用于该前缀
#   easy-dataset/latest.json              —— 站点消费的版本清单
#
# 为什么 --delete 是安全的：
#   aws s3 sync 的 --delete 只删除「目标前缀内」多余的对象。
#   目标前缀是 easy-dataset/<version>/，不会影响其它产品目录，也不会动 latest.json。
#
# 所需 GitHub Secrets：
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
# 所需 GitHub Variables：
#   R2_ACCOUNT_ID  — Cloudflare 账号 ID
#   R2_BUCKET      — 桶名（tsagent-downloads）
#
# 触发时机：
#   `release: published` —— 人工/其它 token 发布 Release 时触发。
#   `workflow_run`       —— **本仓库 release.yml 用 GITHUB_TOKEN 创建 Release，
#                           GitHub 为防递归不会触发 on: release 的其它工作流**，
#                           所以必须同时监听 Release 工作流完成事件，否则同步永不执行。

name: Sync Release to R2

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync（留空则用最新 Release）'
        required: false
        default: ''

permissions:
  contents: read

env:
  PRODUCT_SLUG: 'easy-dataset'
  PRODUCT_NAME: 'Easy Dataset'
  DOWNLOAD_DOMAIN: 'https://dl.tsagent.cc'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if upstream build failed
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Upstream workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG (version ${TAG#v})"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir assets/
          echo "=== assets ==="
          ls -lh assets/

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          RELEASED_AT: ${{ github.event.release.published_at }}
          SLUG: ${{ env.PRODUCT_SLUG }}
          REPO: ${{ github.repository }}
          DOMAIN: ${{ env.DOWNLOAD_DOMAIN }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, pathlib, datetime

          slug = os.environ["SLUG"]
          version = os.environ["VERSION"]
          domain = os.environ["DOMAIN"].rstrip("/")
          repo = os.environ["REPO"]
          released_at = os.environ.get("RELEASED_AT") or \
              datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def classify(name: str):
              n = name.lower()
              if n.endswith(".msi"):
                  return "windows", "x64", "msi"
              if n.endswith(".exe"):
                  return "windows", "x64", "exe"
              if n.endswith(".dmg"):
                  if "aarch64" in n or "arm64" in n:
                      return "macos", "arm64", "dmg"
                  if "x64" in n or "x86" in n or "intel" in n:
                      return "macos", "x64", "dmg"
                  return "macos", "universal", "dmg"
              if n.endswith(".deb"):
                  return ("linux", "arm64" if ("aarch64" in n or "arm64" in n) else "x64", "deb")
              if n.endswith(".rpm"):
                  return ("linux", "arm64" if ("aarch64" in n or "arm64" in n) else "x64", "rpm")
              if n.endswith(".appimage"):
                  return ("linux", "arm64" if ("aarch64" in n or "arm64" in n) else "x64", "appimage")
              return None

          # Tauri 的 .app.tar.gz 是自动更新包，.sig 是签名，都不属于用户手动下载
          def is_updater(name: str) -> bool:
              n = name.lower()
              return n.endswith(".app.tar.gz") or n.endswith(".sig") or n.endswith(".json")

          OS_ORDER = {"windows": 0, "macos": 1, "linux": 2}
          KIND_ORDER = {"exe": 0, "msi": 1, "dmg": 2, "deb": 3, "rpm": 4, "appimage": 5}

          def sha256(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          files = []
          for p in sorted(pathlib.Path("assets").iterdir()):
              if not p.is_file() or p.name.startswith("."):
                  continue
              if is_updater(p.name):
                  print(f"  skip (updater artifact): {p.name}")
                  continue
              oa = classify(p.name)
              if not oa:
                  print(f"  skip (not an installer): {p.name}")
                  continue
              files.append({
                  "os": oa[0],
                  "arch": oa[1],
                  "kind": oa[2],
                  "name": p.name,
                  "url": f"{domain}/{slug}/{version}/{p.name}",
                  "size": p.stat().st_size,
                  "sha256": sha256(p),
              })

          files.sort(key=lambda f: (OS_ORDER[f["os"]], KIND_ORDER[f["kind"]], f["arch"]))

          if not files:
              raise SystemExit("no installer artifacts found in release assets")

          doc = {
              "product": slug,
              "version": version,
              "released_at": released_at,
              "repo": f"https://github.com/{repo}",
              "files": files,
          }
          pathlib.Path("latest.json").write_text(
              json.dumps(doc, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(doc, ensure_ascii=False, indent=2))
          PYEOF

      - name: Sync to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          BUCKET:                ${{ vars.R2_BUCKET }}
          ACCOUNT_ID:            ${{ vars.R2_ACCOUNT_ID }}
          SLUG:                  ${{ env.PRODUCT_SLUG }}
          VERSION:               ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 1. 版本化产物：--delete 只清理 <slug>/<version>/ 内的旧对象
          aws s3 sync assets/ "s3://${BUCKET}/${SLUG}/${VERSION}/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --no-progress \
            --cache-control "public, max-age=31536000, immutable"

          # 2. 版本清单：短缓存，发版后 5 分钟内生效
          aws s3 cp latest.json "s3://${BUCKET}/${SLUG}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --cache-control "public, max-age=300" \
            --content-type "application/json"

          echo "=== ${SLUG}/${VERSION}/ ==="
          aws s3 ls "s3://${BUCKET}/${SLUG}/${VERSION}/" --endpoint-url "$ENDPOINT"
          echo "=== ${SLUG}/latest.json ==="
          aws s3 ls "s3://${BUCKET}/${SLUG}/latest.json" --endpoint-url "$ENDPOINT"

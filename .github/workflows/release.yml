name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish (${{ matrix.label }})
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────
          - label: Windows x86_64
            platform: windows-latest

          # ── macOS ─────────────────────────────────────────
          - label: macOS Apple Silicon
            platform: macos-latest

          # ── Linux ─────────────────────────────────────────
          - label: Linux x86_64
            platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Easy Dataset ${{ github.ref_name }}'
          releaseBody: |
            ### Easy Dataset ${{ github.ref_name }}

            > 本次为 **Pre-release**，安装包见下方 **Assets**，欢迎试用并反馈。

            #### v1.0.1 修复

            - **修复升级安装后接口 404 / `Failed to fetch`**：后端运行目录改为按版本存放并在应用启动时强制同步，
              不再沿用旧版本的后端代码（典型表现：标注页、环境依赖页全部报错）

            #### v1.0.0 主要更新

            - **标注模块**：支持目标检测 / 旋转框（OBB）/ 实例分割三种类型，选定后同工作内锁定；
              旋转框按「矩形 + 角度」建模（拖框顶手柄旋转、角点缩放、角度输入），导出 8 坐标
            - 标注画布拆为底图 + 矢量叠加层，放大后框线/多边形保持锐利；支持 `Ctrl+C` / `Ctrl+V` 复制粘贴标注
            - 数据质量、可视化预览、数据增强、COCO / VOC / LabelMe 转换全面支持多边形与旋转框
            - 修复导出时从第 2 张图起丢标签、质量统计把多边形坐标当宽高的问题
            - AI 自动标注 / 智能抽帧不再限定 YOLOv8：支持 ultralytics 各版本、分割与 OBB 模型及 onnx/engine 导出
            - 客户端运行不再弹出后端 / ffmpeg 控制台窗口（进程树随应用退出）
            - 系统管理新增「环境依赖」页签，可导出 Easy Conda 可导入的 `environment.yml`

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `.exe`（NSIS，推荐）/ `.msi` |
            | macOS Apple Silicon | `.dmg` |
            | Linux x64 | `.AppImage` / `.deb` / `.rpm` |

            提交记录：https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}

            > 打赏完全自愿，不影响任何功能使用。
          releaseDraft: false
          # 预发布阶段：1.0.x 先以 pre-release 发布（不进入自动更新通道）
          prerelease: ${{ startsWith(github.ref_name, 'v1.0.') }}
